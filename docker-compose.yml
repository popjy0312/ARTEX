services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: autumn27/artex:${ARTEX_TAG:-v0.3.15}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD}
      ARTEX_PG_DBNAME: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # Additional organization-specific egress blocks. Built-in policy already
      # denies .cn and known China-operated services.
      ARTEX_EGRESS_DENY_HOSTS: ${ARTEX_EGRESS_DENY_HOSTS:-}
      ARTEX_EGRESS_DENY_CIDRS: ${ARTEX_EGRESS_DENY_CIDRS:-}
    ports:
      # Secure default: expose the management UI only on the local host.
      # Set ARTEX_BIND_ADDR explicitly when a trusted reverse proxy is remote.
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the browsable workspace to data/ in the project root so it can be
      # inspected and backed up directly on the host and survives container rebuilds.
      - ./data:/app/data
      # Persist the JWT signing key, but keep it outside the browsable/downloadable workspace.
      - ./state:/app/state
      # Mount the project-root skills into the container (overriding /app/skills
      # from the image), so skill changes do not require an image rebuild.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
